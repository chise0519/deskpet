[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskpet"
version = "1.2.1"
description = "A floating desktop pet, quick-note and reminder assistant"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "chise0519" }]
dependencies = ["PySide6>=6.5,<7"]

[project.optional-dependencies]
dev = [
    "pytest>=7,<10",
    "ruff>=0.6",
]

[project.scripts]
deskpet = "deskpet.main:main"

[tool.setuptools.packages.find]
include = ["deskpet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/e2e_desktop.py" = ["E402"]
"tests/render_icons.py" = ["E402"]
"tests/smoke_offscreen.py" = ["E402"]
